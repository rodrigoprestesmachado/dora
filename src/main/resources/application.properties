
# ==============================================================================
# Profiles
# ==============================================================================
# This file holds the DEFAULT configuration, effectively used by both the "dev"
# (./mvnw quarkus:dev) and "test" (./mvnw test) profiles, since neither overrides
# most of it. Profile-specific overrides live in separate files, automatically
# merged on top of this one by Quarkus — no "%dev."/"%prod." prefix needed there:
#   - application-dev.properties  — only the handful of settings that differ in
#     dev mode specifically (not in test)
#   - application-prod.properties — LLM provider, Redis/Postgres endpoints, RAG
#     path, etc. for the real Docker Compose deployment

# ==============================================================================
# SSL
# ==============================================================================
# Self-signed certificate for HTTPS on 8444, in addition to plain HTTP on 8080.
quarkus.http.port=8080
quarkus.http.ssl-port=8444
quarkus.http.ssl.certificate.key-store-file=keystore.jks
quarkus.http.ssl.certificate.key-store-file-type=PKCS12
quarkus.http.ssl.certificate.key-store-password=password
quarkus.http.insecure-requests=enabled

# ==============================================================================
# LLM — Ollama (default provider; used in dev/test)
# ==============================================================================
# Default for all profiles except prod: local Ollama running gemma4 (via Dev
# Services or OLLAMA_BASE_URL). Cheap and private for local development; no
# OPENAI_API_KEY required outside of prod. Overridden in
# application-prod.properties to use OpenAI gpt-4o-mini instead.
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.openai.chat-model.enabled=false
quarkus.langchain4j.ollama.chat-model.model-name=gemma4
quarkus.langchain4j.ollama.chat-model.temperature=1
# Default client timeout (10s) is too short for local Ollama inference; raise it to
# avoid NoStackTraceTimeoutException on slower models/hardware (e.g. WhatsApp replies).
quarkus.langchain4j.ollama.timeout=PT2M
# gemma4 has "thinking" capability: Ollama splits the reply into a separate reasoning
# ("thinking") field and the final answer ("content"). Disable thinking mode so the
# model answers directly into "content" (faster, and avoids empty streamed replies).
quarkus.langchain4j.ollama.chat-model.model-options.think=false
# Logs the full request sent to the model (including the list of tools offered, e.g.
# consultarProcessoTjrs) and the raw response (including any tool_calls the model
# decided to make). Useful to confirm whether the agent is actually calling a @Tool.
# Logged at DEBUG by the "dev.langchain4j" / "io.quarkiverse.langchain4j" categories below.
quarkus.langchain4j.ollama.chat-model.log-requests=true
quarkus.langchain4j.ollama.chat-model.log-responses=true

# ==============================================================================
# Logging
# ==============================================================================
# DEBUG on langchain4j packages so the request/response logging above (and any
# tool invocation logged by the LLM client) actually gets printed.
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG

# ==============================================================================
# Conversation memory — Redis
# ==============================================================================
# Sliding window of messages per @MemoryId
# Persisted in Redis via quarkus-langchain4j-memory-store-redis (automatic ChatMemoryStore bean)
quarkus.langchain4j.chat-memory.memory-window.max-messages=20
# Redis connection itself (Dev Services provisions it automatically in dev/test;
# overridden in application-prod.properties to point at the Docker Compose container)

# ==============================================================================
# pgvector — embedding storage
# ==============================================================================
# Dev Services starts Postgres with the vector extension
# dimension=384 matches the local embedding model (all-MiniLM-L6-v2) used by RAG
quarkus.langchain4j.pgvector.dimension=384
quarkus.langchain4j.pgvector.create-table=true

# ==============================================================================
# RAG — Retrieval-Augmented Generation
# ==============================================================================
# Directory with base documents (PDF, text, etc.) automatically ingested on startup.
# Default is a filesystem path relative to the project root, used in dev/test.
# Overridden in application-prod.properties, since the Docker image copies these
# same files into /work/rag (see Dockerfile.jvm).
rag.location=src/main/resources/rag

# Number of context chunks retrieved per message
rag.max-results=3
# Minimum similarity score for a chunk to be used as context
rag.min-score=0.6

# Maximum idle time (in minutes) between user messages before a new chat session starts
chat.inactivity-threshold-minutes=30

# URL scraping (WebScraper/WebScraperPort)
rag.scrape.save-markdown=false
rag.scrape.save-markdown.dir=target/scraped-markdown
# rag.scrape.timeout-seconds=30
# rag.scrape.user-agent=Dora-RAG-Scraper/1.0

# Comma-separated list of URLs to scrape and ingest as RAG documents on startup.
# Example: rag.scrape.urls=https://example.com/page1.html,https://example.com/page2.html
# rag.scrape.urls=

# ==============================================================================
# Chat persistence — Postgres
# ==============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# Fixed credentials for the Postgres Dev Services database (dev/test mode).
# Overridden in application-prod.properties to use the real Docker Compose database.
quarkus.datasource.username=dora
quarkus.datasource.password=dora
quarkus.datasource.devservices.db-name=dora
quarkus.datasource.devservices.port=5432

# ==============================================================================
# WhatsApp Cloud API — Meta (optional)
# ==============================================================================
# If not configured, only the web interface works (no outbound calls are made).
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:dora-webhook-verify}
# Meta App Secret, used to validate the webhook's X-Hub-Signature-256 signature.
# If empty, validation is disabled (only a warning is logged).
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
# OpenAI key used to transcribe WhatsApp audio messages (Whisper). In prod, this is
# the same OPENAI_API_KEY also used as the chat model (see application-prod.properties);
# in dev it's only needed if you want to test WhatsApp audio transcription locally.
whatsapp.openai-api-key=${OPENAI_API_KEY:}

# ==============================================================================
# TJRS process lookup tool (Dora agent @Tool — see DoraTools/TjrsProcessScraper)
# ==============================================================================
# Consulta processual is an Angular SPA with no documented public API, so Playwright
# drives a real headless Chromium browser instead of a plain HTTP fetch.
# tjrs.scrape.base-url=https://consulta.tjrs.jus.br/consulta-processual/
# tjrs.scrape.timeout-seconds=45
# tjrs.scrape.headless=true
# Accessible labels used to locate form fields; adjust if TJRS changes its UI.
# tjrs.scrape.process-number-label=Número Processo
# tjrs.scrape.comarca-label=TJ/Comarca
# tjrs.scrape.search-button-label=Pesquisar
# Comma-separated, case-insensitive substrings that indicate "process not found".
# Default includes the exact message confirmed live on the TJRS results page.
# tjrs.scrape.not-found-markers=nenhum registro encontrado,processo não encontrado,nenhum processo foi localizado,não foi possível localizar,não localizado
# CSS selector scoping the result content (the Angular router-outlet content area),
# excluding the top toolbar, the "voltar/print" menu bar, and the footer/hCaptcha
# disclaimer — confirmed live via inspection of the site's DOM. Falls back to the
# full page HTML if the selector matches nothing.
# tjrs.scrape.result-selector=.content
