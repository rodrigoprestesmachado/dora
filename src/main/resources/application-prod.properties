# ==============================================================================
# Prod-only overrides
# ==============================================================================
# Applied automatically when running with QUARKUS_PROFILE=prod (see docker-compose.yml).
# No "%prod." prefix needed here — every property in this file is scoped to prod.

# ------------------------------------------------------------------------------
# LLM — OpenAI gpt-4o-mini
# ------------------------------------------------------------------------------
# Faster and higher quality than gemma4:e2b on CPU, and avoids running Ollama on the
# EC2 instance (frees RAM). Reuses the same OPENAI_API_KEY already used for
# WhatsApp audio transcription (see whatsapp.openai-api-key in application.properties).
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.ollama.chat-model.enabled=false
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini

# ------------------------------------------------------------------------------
# Conversation memory — Redis
# ------------------------------------------------------------------------------
# Redis runs in its own container reachable at redis://redis:6379 via the internal
# Docker network. Override with REDIS_URL if Redis runs elsewhere.
quarkus.redis.hosts=${REDIS_URL:redis://redis:6379}

# ------------------------------------------------------------------------------
# RAG — Retrieval-Augmented Generation
# ------------------------------------------------------------------------------
# The Docker image copies the base RAG documents into /work/rag (see Dockerfile.jvm),
# so the dev-mode relative path (src/main/resources/rag) doesn't apply here.
rag.location=${RAG_LOCATION:/work/rag}

# ------------------------------------------------------------------------------
# Chat persistence — Postgres
# ------------------------------------------------------------------------------
# Dev Services is disabled and the app connects to the postgres container over the
# internal Docker network. Credentials/URL come from env vars populated from the
# .env file on the host (see docker-compose.yml).
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${POSTGRES_USER:dora}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://postgres:5432/dora}
