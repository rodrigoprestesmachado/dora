# ==============================================================================
# Dev-only overrides
# ==============================================================================
# Applied automatically when running with the "dev" profile (./mvnw quarkus:dev).
# No "%dev." prefix needed here — every property in this file is scoped to dev.

# Quarkus dev mode validates the Host header against localhost/127.0.0.1 by default,
# which blocks requests forwarded through tunnels (ngrok) using a public hostname.
quarkus.http.host-validation.require-localhost=false

# Local chat uses OpenAI. gemma4:e2b offered the scheduling tools but answered
# in prose instead of calling them. Tests stay on Ollama (application.properties).
# The key is read from the environment or from .env (gitignored).
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.ollama.chat-model.enabled=false
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4.1
# The OpenAI client logs the raw body at INFO. Responses arrive as a token stream,
# hundreds of lines per reply, and that pushes the TJRS failure (and its stack)
# out of the terminal. Tool calls are already logged by DoraTools.
quarkus.langchain4j.openai.chat-model.log-requests=false
quarkus.langchain4j.openai.chat-model.log-responses=false
quarkus.log.category."io.quarkiverse.langchain4j.openai".level=WARN

# Google Calendar MCP. The OAuth client JSON is gitignored (gcp-oauth.keys.json).
# The refresh token stays outside the repo. Create the Desktop client in
# Google Auth Platform → Clients for project dora-511322, download the JSON
# into the project root, then run: npx @cocal/google-calendar-mcp auth
quarkus.langchain4j.mcp.google-calendar.environment.GOOGLE_OAUTH_CREDENTIALS=${user.dir}/gcp-oauth.keys.json
quarkus.langchain4j.mcp.google-calendar.environment.GOOGLE_CALENDAR_MCP_TOKEN_PATH=${user.home}/.config/dora/google-calendar-mcp-token.json
